t se synchronise avec DataHub au moyen de flux de données quotidiens ; LegacyOrder, ancien système de prise de commandes, a été retiré en 2025 et remplacé par OrderPortal ; OrderPortal est en production depuis janvier 2026 et de criticité haute, est portée par la Direction Supply Chain et supportée par le prestataire BlueOps en support externalisé, et relaie ses commandes vers StockFlow via FlowBus ; ReportingHub est en production et de criticité moyenne, est portée par la Direction Finance, soutient le processus « Pilotage consolidé » et collecte chaque nuit les données de BillingCore et de StockFlow.
